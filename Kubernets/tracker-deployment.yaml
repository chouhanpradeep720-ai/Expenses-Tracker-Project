apiVersion: apps/v1
kind: Deployment
metadata:
  name: expense-tracker-webapp
  #namespace: tracker
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: expense-tracker-webapp
  template:
    metadata:
      labels:
        app: expense-tracker-webapp
    spec:
      imagePullSecrets:
      - name: docker-secret
      containers:
      - name: expense-tracker-webapp
        image: pradeepchouhan115/docker.repo:Expenses-Tracker.1.0
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: expenses-tracker
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            configMapKeyRef:
              name: expenses-tracker
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD      
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: SPRING_DATASOURCE_PASSWORD
              