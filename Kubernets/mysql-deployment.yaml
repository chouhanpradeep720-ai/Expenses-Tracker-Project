apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-db
  #namespace: tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-db
  template:
    metadata:
      labels:
        app: mysql-db
    spec:
      containers:
      - name: mysql-db
        image: mysql:latest
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: my-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: expenses-tracker 
              key: MYSQL_DATABASE
        volumeMounts:
        - name: mysql-persistent-storage      
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-persistent-storage        
        persistentVolumeClaim:
          claimName: mysql-pvc
